name: VerifyAI CI/CD & Automated Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  validate-and-build:
    name: 1. Validate TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Client TypeScript Check (tsc -b)
        run: npx tsc -b

      - name: Server TypeScript Check (tsc -p tsconfig.server.json --noEmit)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Production Web Build
        run: npm run build

      - name: Generate Web Build Excel Report
        run: npx tsx scripts/generateBuildReport.ts

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 14

  automated-test-matrix:
    name: 2. Automated Test Matrix (1,500 Tests & Excel Report)
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Execute Full 1,500-Test Matrix & Generate Excel Report
        run: npm run test:report

      - name: Validate Generated Excel Test Report & Baseline Preservation
        run: npx vitest run tests/excel-report-validation.test.ts

      - name: Generate Suite HTML & Excel Artifacts
        run: node scripts/generate-artifacts.js

      - name: Upload Selenium Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: reports/selenium-report/
          retention-days: 30

      - name: Upload Appium Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: reports/appium-report/
          retention-days: 30

      - name: Upload Load Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: reports/load-report/
          retention-days: 30

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/security-report/
          retention-days: 30

      - name: Upload VerifyAI Test Cases Excel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerifyAI_Test_Cases
          path: reports/VerifyAI_Test_Cases.xlsx
          retention-days: 30

      - name: Upload Complete 1,500-Test Excel Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerifyAI-Test-Report-1500
          path: reports/VerifyAI_Test_Report.xlsx
          retention-days: 30

      - name: Publish Direct Excel Workbooks to GitHub Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-reports --yes || true
          gh release create latest-reports \
            reports/selenium-report.xlsx \
            reports/appium-report.xlsx \
            reports/load-report.xlsx \
            reports/security-report.xlsx \
            reports/web-build-report.xlsx \
            reports/VerifyAI_Test_Cases.xlsx \
            reports/VerifyAI_Test_Report.xlsx \
            --title "VerifyAI Test Execution Excel Workbooks" \
            --notes "Direct single-click Excel (.xlsx) downloads for all automated test reports." || true

      - name: Publish Step Summary with Direct Excel Download Links
        run: |
          echo "## 📊 VerifyAI Automated QA Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Direct Excel Workbook Downloads (Single-click .xlsx — No ZIP extraction required)" >> $GITHUB_STEP_SUMMARY
          echo "| Suite / Artifact Category | Direct Download (.xlsx) | Mirror / Live Web Download | Scope & Content |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **1. Selenium Web Tests** | [Direct .xlsx](https://github.com/puneethr2362sse/PPD-APP/raw/main/reports/selenium-report.xlsx) | [Web .xlsx](https://app-eight-woad-32.vercel.app/reports/selenium-report.xlsx) | 300 Selenium Web E2E & Component test cases |" >> $GITHUB_STEP_SUMMARY
          echo "| **2. Appium Mobile Tests** | [Direct .xlsx](https://github.com/puneethr2362sse/PPD-APP/raw/main/reports/appium-report.xlsx) | [Web .xlsx](https://app-eight-woad-32.vercel.app/reports/appium-report.xlsx) | 300 Appium Native & Mobile Navigation cases |" >> $GITHUB_STEP_SUMMARY
          echo "| **3. Load Stress Tests** | [Direct .xlsx](https://github.com/puneethr2362sse/PPD-APP/raw/main/reports/load-report.xlsx) | [Web .xlsx](https://app-eight-woad-32.vercel.app/reports/load-report.xlsx) | 300 High-concurrency throughput benchmarks |" >> $GITHUB_STEP_SUMMARY
          echo "| **4. Security Assessment** | [Direct .xlsx](https://github.com/puneethr2362sse/PPD-APP/raw/main/reports/security-report.xlsx) | [Web .xlsx](https://app-eight-woad-32.vercel.app/reports/security-report.xlsx) | 300 Zero-trust defense & vulnerability cases |" >> $GITHUB_STEP_SUMMARY
          echo "| **5. Web Build Validation** | [Direct .xlsx](https://github.com/puneethr2362sse/PPD-APP/raw/main/reports/web-build-report.xlsx) | [Web .xlsx](https://app-eight-woad-32.vercel.app/reports/web-build-report.xlsx) | Client/Server typecheck & secret scan checks |" >> $GITHUB_STEP_SUMMARY
          echo "| **⭐ Complete Master Workbook** | [VerifyAI_Test_Cases.xlsx](https://github.com/puneethr2362sse/PPD-APP/raw/main/reports/VerifyAI_Test_Cases.xlsx) | [Web .xlsx](https://app-eight-woad-32.vercel.app/VerifyAI_Test_Cases.xlsx) | Complete 1,504-test workbook with separate worksheets |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Note for Reviewers & Professors:** Standard GitHub Actions artifact buttons package files into a .zip. To open directly in Microsoft Excel without extracting ZIP files, use the **Direct Download (.xlsx)** links above." >> $GITHUB_STEP_SUMMARY

  api-verification-e2e:
    name: 3. Text & Image API Integration Verification
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Text & Image End-to-End Tests (Real Claims & Real 13KB Image)
        run: npx vitest run tests/api-verification.test.ts
        env:
          NODE_ENV: test

      - name: Run Real Verification CLI Test Harness
        run: npx tsx scripts/testRealVerification.ts
        env:
          NODE_ENV: test
